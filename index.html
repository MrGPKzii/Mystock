<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockApp - Login & Register</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#10B981', // Emerald Green สำหรับธีมการลงทุน
                            600: '#059669',
                            dark: '#0F172A', // Slate 900
                            card: '#1E293B'  // Slate 800
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Header / Logo -->
        <div class="p-6 text-center border-b border-slate-800 bg-slate-900/50">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 mb-3 border border-emerald-500/20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">StockApp</h1>
            <p class="text-xs text-slate-400 mt-1">ระบบบริหารจัดการและวิเคราะห์การเทรดหุ้น</p>
        </div>

        <!-- Tab Switches -->
        <div class="flex border-b border-slate-800 bg-slate-900/30">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-3 text-sm font-medium border-b-2 border-emerald-500 text-emerald-400 transition-all">
                เข้าสู่ระบบ
            </button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all">
                สมัครสมาชิก
            </button>
        </div>

        <div class="p-6">
            <!-- Alert Message Box -->
            <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border"></div>

            <!-- ================= FORM LOGIN ================= -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">อีเมล (Email)</label>
                    <input type="email" id="login-email" required placeholder="name@example.com"
                        class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">รหัสผ่าน (Password)</label>
                    <input type="password" id="login-password" required placeholder="••••••••"
                        class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <button type="submit" 
                    class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-lg text-sm transition-all shadow-lg shadow-emerald-500/20 active:scale-[0.99]">
                    เข้าสู่ระบบ
                </button>
            </form>

            <!-- ================= FORM REGISTER ================= -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">ชื่อผู้ใช้ (Username)</label>
                    <input type="text" id="reg-username" required placeholder="trader_john"
                        class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">อีเมล (Email)</label>
                    <input type="email" id="reg-email" required placeholder="name@example.com"
                        class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">รหัสผ่าน (Password)</label>
                    <input type="password" id="reg-password" minlength="6" required placeholder="ขั้นต่ำ 6 ตัวอักษร"
                        class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">ยืนยันรหัสผ่าน (Confirm Password)</label>
                    <input type="password" id="reg-confirm-password" minlength="6" required placeholder="••••••••"
                        class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                
                <!-- Notice สำหรับเงื่อนไข Pending & Level 1 -->
                <div class="p-3 bg-amber-500/10 border border-amber-500/20 rounded-lg">
                    <p class="text-[11px] text-amber-400">
                        * เมื่อสมัครสมาชิก บัญชีของคุณจะมีสถานะ <strong>"รออนุมัติ (Pending)"</strong> และระดับ <strong>Level 1</strong> จนกว่าผู้ดูแลระบบจะทำการอนุมัติ
                    </p>
                </div>

                <button type="submit" 
                    class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-lg text-sm transition-all shadow-lg shadow-emerald-500/20 active:scale-[0.99]">
                    สมัครสมาชิก
                </button>
            </form>
        </div>
    </div>

    <!-- Script หลัก -->
    <script src="auth.js"></script>
</body>
</html>
